<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Quote — Hanabira Archives</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Crimson Pro', serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="max-w-2xl mx-auto p-6">
    <div class="text-center mb-6">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Hanabira Archives Logo" class="w-16 h-16 mx-auto rounded-full">
      <h1 class="text-3xl font-bold mt-2">Submit a Quote</h1>
      <p class="text-gray-600 text-sm">Share a memorable line from an anime, web novel, or light novel.</p>
    </div>

    {% if message %}
      <div class="mb-4 p-4 rounded-xl {{ 'bg-green-100 text-green-800' if success else 'bg-red-100 text-red-800' }}">
        {{ message }}
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      <input type="text" name="anime" placeholder="Anime / Novel" required class="w-full p-2 border rounded-xl" />
      <input type="text" name="character" placeholder="Character" required class="w-full p-2 border rounded-xl" />
      <textarea name="quote" rows="4" placeholder="The quote..." required class="w-full p-2 border rounded-xl"></textarea>
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600">Submit</button>
    </form>

    <div class="text-center mt-6">
      <a href="{{ url_for('home') }}" class="text-blue-500 hover:underline">← Back to Home</a>
    </div>
  </div>

  <footer class="text-center text-sm text-gray-500 mt-10 py-4 border-t">
    Unique visitors: {{ unique_visits }} · © less-real.com · Hanabira Archives
  </footer>
</body>
</html>
