<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Quotes</title>
  <script src="https://cdn.tailwindcss.com"></script>
<meta name="google-adsense-account" content="ca-pub-2540596238584085">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2540596238584085"
     crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div class="max-w-3xl mx-auto p-6">
    <h1 class="text-4xl font-bold text-center mb-6">Anime Quotes</h1>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input id="anime" type="text" placeholder="Filter by Anime" class="p-2 border border-gray-300 rounded-xl w-full" />
      <input id="character" type="text" placeholder="Filter by Character" class="p-2 border border-gray-300 rounded-xl w-full" />
      <input id="keyword" type="text" placeholder="Search by Keyword" class="p-2 border border-gray-300 rounded-xl w-full" />
    </div>

    <div class="flex gap-4 mb-6">
      <button onclick="getRandomQuote()" class="bg-blue-500 text-white px-4 py-2 rounded-xl hover:bg-blue-600">Random Quote</button>
      <button onclick="searchQuotes()" class="bg-green-500 text-white px-4 py-2 rounded-xl hover:bg-green-600">Search</button>
    </div>

    <div id="quote-container" class="space-y-6"></div>
  </div>

  <script>
    async function getRandomQuote() {
      const res = await fetch('/quotes/random');
      const data = await res.json();
      displayQuotes([data]);
    }

    async function searchQuotes() {
      const anime = document.getElementById('anime').value;
      const character = document.getElementById('character').value;
      const keyword = document.getElementById('keyword').value;
      const params = new URLSearchParams({ anime, character, keyword });

      const res = await fetch(`/quotes?${params.toString()}`);
      const data = await res.json();
      if (data.length > 0) displayQuotes(data);
      else {
        document.getElementById('quote-container').innerHTML = `<div class="bg-white rounded-2xl shadow-md p-6"><p class="text-xl italic mb-4">No matching quotes found.</p></div>`;
      }
    }

    function displayQuotes(quotes) {
      const container = document.getElementById('quote-container');
      container.innerHTML = '';
      quotes.forEach((quote) => {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-2xl shadow-md p-6';
        div.innerHTML = `
          <p class="text-xl italic mb-4">"${quote.quote}"</p>
          <p class="text-right text-sm text-gray-500">- ${quote.character} (${quote.anime})</p>
        `;
        container.appendChild(div);
      });
    }

    getRandomQuote();
  </script>
</body>
</html>
